# `docker compose up --build`, then open http://localhost:4173 (API docs at
# http://localhost:8000/docs). Ports can be changed: FRONTEND_PORT=3000 docker compose up.
# Data persists in the `tickets-data` volume; `docker compose down -v` deletes it and the next
# start loads the seed again.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - tickets-data:/data

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-4173}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  tickets-data:
