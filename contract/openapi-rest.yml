openapi: 3.0.3

info:
  title: Mini Tickets API
  version: 1.0.0
  description: |
    API to manage security tickets assigned to development teams.

    ## Authentication and simulated identity

    The API is protected by a bearer token (`bearerAuth`). In this exercise there is no real
    login: the caller identity is simulated with two request headers, which every operation reads.

    | Header | Example | Description |
    | --- | --- | --- |
    | `X-User-Team` | `Payments` | Team the caller belongs to. Required. |
    | `X-User-Permissions` | `tickets.read,tickets.update` | Comma-separated permissions. |

    Known permissions:

    - `tickets.read`: read tickets (required by every ticket operation).
    - `tickets.update`: set the due date of a ticket.
    - `tickets.read.all`: read restricted tickets of any team.

    A request without `X-User-Team` is rejected with `401`.

    ## Visibility

    A ticket is visible to the caller when it is not restricted, when the caller's team is its
    creator team or its assigned team, or when the caller has `tickets.read.all`. A ticket that
    exists but is not visible behaves exactly like a missing one (`404`), so its existence is not
    leaked.

    ## Errors

    Every error response uses Problem Details (RFC 9457) with media type
    `application/problem+json`.

    ## Dates

    All dates are UTC. `targetDate` and `dueDate` are calendar dates (`YYYY-MM-DD`); `createdAt`
    and `lastModified` are RFC 3339 timestamps.

servers:
  - url: https://api.mini-tickets.test
    description: Example server. Only HTTPS is supported.

security:
  - bearerAuth: []

tags:
  - name: Users
    description: Information about the current caller.
  - name: Tickets
    description: Security tickets assigned to development teams.

paths:
  /api/v1/me:
    get:
      operationId: getCurrentUser
      tags: [Users]
      summary: Get the current user
      description: Returns the team and permissions of the caller, resolved from the identity headers.
      responses:
        "200":
          description: The current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/tickets:
    get:
      operationId: searchTickets
      tags: [Tickets]
      summary: Search tickets
      description: |
        Returns a page of the tickets visible to the caller, filtered, searched and sorted.

        Only visible tickets are returned and counted in `totalElements`. Sorting is stable:
        ties are broken by `id`, so two identical requests return the same order and no ticket
        appears in two pages.
      parameters:
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Query"
        - $ref: "#/components/parameters/StateFilter"
        - $ref: "#/components/parameters/SeverityFilter"
        - $ref: "#/components/parameters/AssignedTeam"
        - $ref: "#/components/parameters/ExpiredOnly"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Direction"
      responses:
        "200":
          description: A page of visible tickets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableContent"

  /api/v1/tickets/{id}:
    parameters:
      - $ref: "#/components/parameters/TicketId"
    get:
      operationId: getTicket
      tags: [Tickets]
      summary: Get a ticket
      description: Returns a ticket by id. Responds `404` when the ticket does not exist or is not visible to the caller.
      responses:
        "200":
          description: The ticket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
    patch:
      operationId: setTicketDueDate
      tags: [Tickets]
      summary: Set the due date of a ticket
      description: |
        Sets the due date the team commits to. Requires `tickets.update`.

        If the ticket is `REPORTED` it moves to `IN_PROGRESS`. `lastModified` is updated and the
        updated ticket is returned.

        Checks are applied in this order: permission (`403`), visibility (`404`), ticket already
        `DONE` (`409`), due date before today (`422`). A malformed body is rejected with `422`
        before any of these checks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetDueDateRequest"
      responses:
        "200":
          description: The updated ticket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Bearer token. Not validated in this exercise: the identity is simulated with the
        `X-User-Team` and `X-User-Permissions` headers (see the API description).

  parameters:
    TicketId:
      name: id
      in: path
      required: true
      description: Ticket identifier.
      schema:
        type: string
        format: uuid
        maxLength: 36
      example: b7c1e0de-6f0a-4f43-9a55-0a2f6c1d8e11
    Offset:
      name: offset
      in: query
      required: false
      description: Number of tickets to skip.
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 100000
        default: 0
      example: 20
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of tickets in the page.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
      example: 20
    Query:
      name: q
      in: query
      required: false
      description: Case-insensitive text searched in `key`, `title` and `asset`. Empty means no search.
      schema:
        type: string
        maxLength: 256
        default: ""
      example: log4j
    StateFilter:
      name: state
      in: query
      required: false
      description: |
        Only tickets in one of these states. Repeat the parameter to pass several values
        (`state=REPORTED&state=IN_PROGRESS`). Omitted means every state.
      style: form
      explode: true
      schema:
        type: array
        minItems: 1
        maxItems: 4
        uniqueItems: true
        items:
          $ref: "#/components/schemas/TicketState"
        default: [REPORTED, IN_PROGRESS, PENDING_SECURITY, DONE]
      example: [IN_PROGRESS]
    SeverityFilter:
      name: severity
      in: query
      required: false
      description: |
        Only tickets with one of these severities. Repeat the parameter to pass several values
        (`severity=CRITICAL&severity=HIGH`). Omitted means every severity.
      style: form
      explode: true
      schema:
        type: array
        minItems: 1
        maxItems: 4
        uniqueItems: true
        items:
          $ref: "#/components/schemas/Severity"
        default: [CRITICAL, HIGH, MEDIUM, LOW]
      example: [HIGH]
    AssignedTeam:
      name: assignedTeam
      in: query
      required: false
      description: Only tickets assigned to this team (exact match). Empty means any team.
      schema:
        type: string
        maxLength: 100
        default: ""
      example: Payments
    ExpiredOnly:
      name: expiredOnly
      in: query
      required: false
      description: When `true`, only expired tickets (not `DONE` and `targetDate` before today).
      schema:
        type: boolean
        default: false
      example: true
    Sort:
      name: sort
      in: query
      required: false
      description: Field to sort by. Ties are always broken by `id`.
      schema:
        $ref: "#/components/schemas/TicketSortField"
      example: TARGET_DATE
    Direction:
      name: direction
      in: query
      required: false
      description: Sort direction.
      schema:
        $ref: "#/components/schemas/SortDirection"
      example: ASC

  responses:
    Unauthorized:
      description: The identity headers are missing or malformed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: about:blank
            title: Unauthorized
            status: 401
            detail: The X-User-Team header is required.
    Forbidden:
      description: The caller lacks the permission required by the operation.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: about:blank
            title: Forbidden
            status: 403
            detail: The tickets.update permission is required.
    NotFound:
      description: The ticket does not exist or is not visible to the caller.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: about:blank
            title: Not Found
            status: 404
            detail: Ticket b7c1e0de-6f0a-4f43-9a55-0a2f6c1d8e11 not found.
    Conflict:
      description: The ticket is in a state that does not allow the operation.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: about:blank
            title: Conflict
            status: 409
            detail: The ticket is already DONE.
    UnprocessableContent:
      description: A parameter or the request body is invalid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: about:blank
            title: Unprocessable Content
            status: 422
            detail: The request has invalid parameters.
            invalidParams:
              - name: limit
                reason: Input should be less than or equal to 100.

  schemas:
    TicketState:
      type: string
      description: Lifecycle state of a ticket. REPORTED → IN_PROGRESS → PENDING_SECURITY → DONE.
      enum: [REPORTED, IN_PROGRESS, PENDING_SECURITY, DONE]
      example: IN_PROGRESS
    Severity:
      type: string
      description: Severity of the security issue.
      enum: [CRITICAL, HIGH, MEDIUM, LOW]
      example: HIGH
    TicketSortField:
      type: string
      description: Field the ticket list can be sorted by.
      enum: [KEY, SEVERITY, STATE, TARGET_DATE, LAST_MODIFIED]
      default: LAST_MODIFIED
      example: TARGET_DATE
    SortDirection:
      type: string
      description: Sort direction.
      enum: [ASC, DESC]
      default: DESC
      example: ASC

    Ticket:
      type: object
      description: A security ticket assigned to a development team.
      required:
        - id
        - key
        - title
        - asset
        - creatorTeam
        - assignedTeam
        - assignee
        - severity
        - state
        - restricted
        - targetDate
        - dueDate
        - expired
        - createdAt
        - lastModified
      properties:
        id:
          type: string
          format: uuid
          maxLength: 36
          description: Unique identifier.
          example: b7c1e0de-6f0a-4f43-9a55-0a2f6c1d8e11
        key:
          type: string
          pattern: "^[A-Z][A-Z0-9]{1,9}-[0-9]{1,6}$"
          maxLength: 17
          description: Human-readable key.
          example: SEC-1024
        title:
          type: string
          maxLength: 200
          description: Short description of the issue.
          example: Log4j vulnerable version in payments-api
        asset:
          type: string
          maxLength: 100
          description: Affected asset. The literal string `None` when the asset is unknown.
          example: payments-api
        creatorTeam:
          type: string
          maxLength: 100
          description: Team that created the ticket.
          example: Security Champions
        assignedTeam:
          type: string
          maxLength: 100
          description: Team the ticket is assigned to.
          example: Payments
        assignee:
          type: string
          format: email
          maxLength: 254
          description: Email of the person in charge.
          example: jdoe@example.com
        severity:
          allOf:
            - $ref: "#/components/schemas/Severity"
          description: Severity of the issue.
          example: HIGH
        state:
          allOf:
            - $ref: "#/components/schemas/TicketState"
          description: Current state.
          example: REPORTED
        restricted:
          type: boolean
          description: When `true`, only the creator team, the assigned team and callers with `tickets.read.all` can see it.
          example: false
        targetDate:
          type: string
          format: date
          maxLength: 10
          description: Deadline computed when the ticket was created. Immutable.
          example: "2026-11-30"
        dueDate:
          type: string
          format: date
          maxLength: 10
          nullable: true
          description: Date the team commits to. `null` until it is set.
          example: "2026-11-15"
        expired:
          type: boolean
          readOnly: true
          description: Computed by the server. `true` when the ticket is not `DONE` and `targetDate` is before today (UTC).
          example: false
        createdAt:
          type: string
          format: date-time
          maxLength: 35
          description: Creation timestamp (UTC).
          example: "2026-10-01T09:12:00Z"
        lastModified:
          type: string
          format: date-time
          maxLength: 35
          description: Timestamp of the last change (UTC).
          example: "2026-10-20T15:40:00Z"
      example:
        id: b7c1e0de-6f0a-4f43-9a55-0a2f6c1d8e11
        key: SEC-1024
        title: Log4j vulnerable version in payments-api
        asset: payments-api
        creatorTeam: Security Champions
        assignedTeam: Payments
        assignee: jdoe@example.com
        severity: HIGH
        state: REPORTED
        restricted: false
        targetDate: "2026-11-30"
        dueDate: null
        expired: false
        createdAt: "2026-10-01T09:12:00Z"
        lastModified: "2026-10-20T15:40:00Z"

    Pagination:
      type: object
      description: Position of the page within the full result.
      required: [offset, limit, totalElements]
      properties:
        offset:
          type: integer
          format: int32
          minimum: 0
          maximum: 100000
          description: Number of tickets skipped, as requested.
          example: 0
        limit:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          description: Page size, as requested.
          example: 20
        totalElements:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000000
          description: Total number of visible tickets matching the filters.
          example: 134
      example:
        offset: 0
        limit: 20
        totalElements: 134

    TicketPage:
      type: object
      description: A page of tickets.
      required: [data, pagination]
      properties:
        data:
          type: array
          maxItems: 100
          description: Tickets in the page, in the requested order.
          items:
            $ref: "#/components/schemas/Ticket"
          example:
            - id: b7c1e0de-6f0a-4f43-9a55-0a2f6c1d8e11
              key: SEC-1024
              title: Log4j vulnerable version in payments-api
              asset: payments-api
              creatorTeam: Security Champions
              assignedTeam: Payments
              assignee: jdoe@example.com
              severity: HIGH
              state: REPORTED
              restricted: false
              targetDate: "2026-11-30"
              dueDate: null
              expired: false
              createdAt: "2026-10-01T09:12:00Z"
              lastModified: "2026-10-20T15:40:00Z"
        pagination:
          allOf:
            - $ref: "#/components/schemas/Pagination"
          description: Position of the page within the full result.
          example:
            offset: 0
            limit: 20
            totalElements: 1
      example:
        data:
          - id: b7c1e0de-6f0a-4f43-9a55-0a2f6c1d8e11
            key: SEC-1024
            title: Log4j vulnerable version in payments-api
            asset: payments-api
            creatorTeam: Security Champions
            assignedTeam: Payments
            assignee: jdoe@example.com
            severity: HIGH
            state: REPORTED
            restricted: false
            targetDate: "2026-11-30"
            dueDate: null
            expired: false
            createdAt: "2026-10-01T09:12:00Z"
            lastModified: "2026-10-20T15:40:00Z"
        pagination:
          offset: 0
          limit: 20
          totalElements: 1

    CurrentUser:
      type: object
      description: The caller, resolved from the identity headers.
      required: [team, permissions]
      properties:
        team:
          type: string
          maxLength: 100
          description: Team the caller belongs to.
          example: Payments
        permissions:
          type: array
          maxItems: 20
          description: Permissions granted to the caller.
          items:
            type: string
            pattern: "^[a-z]+(\\.[a-z]+)*$"
            maxLength: 64
            description: Permission name.
            example: tickets.update
          example: [tickets.read, tickets.update]
      example:
        team: Payments
        permissions: [tickets.read, tickets.update]

    SetDueDateRequest:
      type: object
      description: New due date for a ticket.
      required: [dueDate]
      additionalProperties: false
      properties:
        dueDate:
          type: string
          format: date
          maxLength: 10
          description: Date the team commits to. Must not be before today (UTC).
          example: "2026-11-15"
      example:
        dueDate: "2026-11-15"

    InvalidParam:
      type: object
      description: A parameter or body field that failed validation.
      required: [name, reason]
      properties:
        name:
          type: string
          maxLength: 256
          description: Name of the parameter or dotted path of the body field.
          example: limit
        reason:
          type: string
          maxLength: 1000
          description: Why the value was rejected.
          example: Input should be less than or equal to 100.
      example:
        name: limit
        reason: Input should be less than or equal to 100.

    Problem:
      type: object
      description: Error details following RFC 9457 (Problem Details for HTTP APIs).
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          maxLength: 2048
          description: URI reference identifying the problem type. `about:blank` when the HTTP status is enough.
          example: about:blank
        title:
          type: string
          maxLength: 200
          description: Short, human-readable summary of the problem type.
          example: Conflict
        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
          description: HTTP status code.
          example: 409
        detail:
          type: string
          maxLength: 2000
          description: Human-readable explanation of this occurrence.
          example: The ticket is already DONE.
        instance:
          type: string
          format: uri-reference
          maxLength: 2048
          description: URI reference of this occurrence.
          example: /api/v1/tickets/b7c1e0de-6f0a-4f43-9a55-0a2f6c1d8e11
        invalidParams:
          type: array
          maxItems: 100
          description: Validation errors. Only present on `422` responses.
          items:
            $ref: "#/components/schemas/InvalidParam"
          example:
            - name: limit
              reason: Input should be less than or equal to 100.
      example:
        type: about:blank
        title: Conflict
        status: 409
        detail: The ticket is already DONE.
        instance: /api/v1/tickets/b7c1e0de-6f0a-4f43-9a55-0a2f6c1d8e11
