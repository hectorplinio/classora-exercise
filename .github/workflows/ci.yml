name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Placeholder jobs: each one is filled in by the PR that introduces its part.
  # They exist from the start so branch protection can require them.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Lint contract
        run: npx -y @redocly/cli@2.72.1 lint contract/openapi-rest.yml --config contract/redocly.yaml

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Backend checks added in chore/backend-setup"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Frontend checks added in chore/frontend-setup"
