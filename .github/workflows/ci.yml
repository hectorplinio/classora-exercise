name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every job exists from the start so branch protection can require it; placeholders are
  # filled in by the PR that introduces their part.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Lint contract
        run: npx -y @redocly/cli@2.72.1 lint contract/openapi-rest.yml --config contract/redocly.yaml

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check
      - name: Check formatting
        run: uv run ruff format --check
      - name: Type check
        run: uv run mypy
      - name: Check architecture rules
        run: uv run lint-imports
      - name: Test (100% line and branch coverage required)
        run: uv run pytest --cov
      # Same job (keeps the required check name stable); separate venv for the minimum version.
      - name: Test on Python 3.11 (minimum supported)
        env:
          UV_PROJECT_ENVIRONMENT: .venv-py311
        run: uv run --locked --python 3.11 pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # The API client is generated from the contract: if they drift apart, the build fails.
      - name: Check the API client matches the contract
        run: |
          npm run generate:api
          git diff --exit-code -- src/api/generated
          test -z "$(git status --porcelain -- src/api/generated)"
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test (100% coverage required)
        run: npm run test:coverage
      - name: Build
        run: npx vite build

  # Real backend + production frontend build, driven by Playwright (statement, Part B.5).
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  # The Docker setup builds and starts: the app answers through nginx and the API is healthy.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and start
        run: docker compose up --build --detach --wait
      - name: Smoke test
        run: |
          curl --fail --silent http://localhost:4173/ > /dev/null
          curl --fail --silent http://localhost:4173/api/v1/me \
            -H 'X-User-Team: Payments' -H 'X-User-Permissions: tickets.read'
      - name: Logs on failure
        if: failure()
        run: docker compose logs
