# Weekly dependency updates, one grouped PR per ecosystem. Every update goes through the same CI
# as any change (contract, backend, frontend, end-to-end and Docker checks).
# Major versions are ignored: they need a deliberate migration (the statement requires React 18,
# and typescript-eslint does not support TypeScript 7 yet), so they are done by hand.
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      backend:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      frontend:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: ["/backend", "/frontend"]
    schedule:
      interval: weekly
    # Runtime images change language versions on minors too (Python 3.13 -> 3.15): patches only.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      docker:
        patterns: ["*"]
