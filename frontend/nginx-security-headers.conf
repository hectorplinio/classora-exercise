# Included in every location: nginx only inherits `add_header` from the server block when a
# location declares none, and every location here declares its own cache headers.
#
# The build has no inline scripts or styles, so everything can come from this origin; `data:`
# images are the inline favicon.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
